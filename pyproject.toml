[project]
name = "extendable-timer"
version = "0.1.0"
description = "Home Assistant Extendable Timer custom integration."
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
bypass-selection = true

# Lint config — opinionated minimal set, not mirrored from HA core. The HA-core
# parity strategy was abandoned because the verbose verbatim copy outweighed
# its hypothetical upstream-contribution payoff. See CLAUDE.md "Comments and
# docstrings" for the docstring philosophy and the ha-development skill for
# the broader rationale.
[tool.ruff]
required-version = ">=0.15.12"

[tool.ruff.lint]
extend-select = [
  "ASYNC",  # flake8-async — HA's event loop is async-first
  "B",      # flake8-bugbear — common Python footguns
  "D",      # pydocstyle — quality checks on docstrings *when present*
  "G",      # flake8-logging-format
  "I",      # isort
  "LOG",    # flake8-logging
  "N",      # pep8-naming
  "PIE",    # flake8-pie — misc cleanups
  "PT",     # flake8-pytest-style
  "RET",    # flake8-return
  "RUF",    # ruff-specific
  "SIM",    # flake8-simplify
  "T20",    # flake8-print — no stray print()
  "TID",    # flake8-tidy-imports — required for the banned-api block below
  "UP",     # pyupgrade
]

ignore = [
  # Don't require docstrings on every public symbol; well-named identifiers
  # already document themselves and filler stubs add noise. Quality checks
  # (D2xx / D4xx) still apply when a docstring *is* written.
  "D100", # Missing docstring in public module
  "D101", # Missing docstring in public class
  "D102", # Missing docstring in public method
  "D103", # Missing docstring in public function
  "D104", # Missing docstring in public package
  "D106", # Missing docstring in public nested class
  "D107", # Missing docstring in `__init__`
  "D203", # 1 blank line required before class docstring (conflicts with D211)
  "D213", # Multi-line summary should start at the second line (conflicts with D212)

  # Conflicts with the formatter — see https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "D206", "D300", "E111", "E114", "E117", "W191",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Not needed — Home Assistant requires Python 3.14+"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

# mypy — strict on integration source; relaxed inside tests.
[tool.mypy]
strict = true
python_version = "3.12"
platform = "linux"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
